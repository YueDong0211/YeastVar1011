name: Validate and publish website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:public
      - run: node research/qa-local-model-lifecycle-v22.cjs
      - run: node research/qa-input-contracts-v22.cjs
      - name: Assistant interface and catalogue integration
        run: |
          PORT=4173 node scripts/dev-server.cjs &
          YV_TEST_URL=http://127.0.0.1:4173/ node research/qa-assistant-ui-v22.cjs

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/qa-doctor.cjs
      - run: node research/qa-dev-server.cjs
      - if: runner.os != 'Windows'
        run: sh scripts/setup.sh --port 0
      - if: runner.os == 'Windows'
        run: ./scripts/setup.ps1 -Port 0
        shell: pwsh

  deploy:
    if: github.event_name != 'pull_request'
    needs: [validate, compatibility]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
